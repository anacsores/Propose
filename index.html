<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedido Especial</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Tela de Login -->
    <div id="login-screen" class="container">
        <h2>user == love</h2>
        <h3>password: a soma de 29² - 8². </h3>
        <input type="text" id="username" placeholder="Usuário">
        <input type="password" id="password" placeholder="Senha">
        <button onclick="fazerLogin()">Entrar</button>
        <p id="error-msg" class="error"></p>
    </div>

    <!-- Tela do Pedido (Escondida inicialmente) -->
    <div id="proposal-screen" class="container hidden">
        <h2>Você quer namorar comigo?</h2>
        <div class="buttons">
            <button id="btn-yes" onclick="aceitou()">Sim!</button>
            <button id="btn-no">Não</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
